name: Test, package and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-globe-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portfolio-globe
  CONTAINER_NAME: portfolio-globe
  HOST_PORT: "5100"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start test application
        run: |
          npm run dev -- --port 5100 > /tmp/portfolio-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-vite.log
          exit 1
      - run: npm run test:e2e

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy isolated portfolio container
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ needs.package.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_REF,CONTAINER_NAME,HOST_PORT
          script_stop: true
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_REF"
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${HOST_PORT}:80" \
              --label app=portfolio-globe \
              "$IMAGE_REF"
            healthy=false
            for attempt in 1 2 3 4 5 6; do
              if wget -qO- "http://127.0.0.1:${HOST_PORT}/healthz" | grep -q '^ok$'; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo "Container health check failed"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            cable_count=$(wget -qO- "http://127.0.0.1:${HOST_PORT}/api/telegeography/cables" | grep -o '"type":"Feature"' | wc -l)
            if [ "$cable_count" -lt 700 ]; then
              echo "Cable dataset validation failed: ${cable_count} features"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            docker image prune -f
            exit 0
