server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/telegeography/cables {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    proxy_ssl_server_name on;
    proxy_set_header Host www.submarinecablemap.com;
    proxy_pass https://www.submarinecablemap.com/api/v3/cable/cable-geo.json;
  }

  location ~ ^/api/telegeography/cable/([a-zA-Z0-9_-]+)$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    proxy_ssl_server_name on;
    proxy_set_header Host www.submarinecablemap.com;
    proxy_pass https://www.submarinecablemap.com/api/v3/cable/$1.json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
