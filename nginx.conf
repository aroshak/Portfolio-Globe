proxy_cache_path /var/cache/nginx/cables levels=1:2 keys_zone=cable_geojson:10m max_size=50m inactive=6h use_temp_path=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/telegeography/cables {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    proxy_ssl_server_name on;
    proxy_set_header Host www.submarinecablemap.com;
    proxy_set_header Accept-Encoding "";
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_read_timeout 60s;
    proxy_cache cable_geojson;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 2h;
    add_header X-Cable-Cache $upstream_cache_status always;
    proxy_pass https://www.submarinecablemap.com/api/v3/cable/cable-geo.json;
  }

  location ~ ^/api/telegeography/cable/([a-zA-Z0-9_-]+)$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    proxy_ssl_server_name on;
    proxy_set_header Host www.submarinecablemap.com;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 30s;
    proxy_pass https://www.submarinecablemap.com/api/v3/cable/$1.json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
